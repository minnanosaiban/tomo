<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 420" width="832" height="420" font-family="'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic UI', 'Meiryo', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs><rect width="832" height="420" fill="#0f172a"/><text x="416.0" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#e2e8f0">1つの発話の結果と、呼び出し側の動作</text><text x="812" y="410" text-anchor="end" font-size="11" fill="#94a3b8">eng-sound 技術解説</text><rect x="36" y="160" width="170" height="80" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2.2"/><text x="121.0" y="197.0" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">1つの発話</text><text x="121.0" y="214.0" text-anchor="middle" font-size="11" fill="#94a3b8">speak() + 上限タイマー</text><rect x="300" y="66" width="230" height="54" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2.2"/><text x="415.0" y="90.0" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">ended</text><text x="415.0" y="107.0" text-anchor="middle" font-size="11" fill="#94a3b8">onend が届いた</text><line x1="206" y1="200" x2="300" y2="93" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ah)"/><line x1="530" y1="93" x2="600" y2="93" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ah)"/><text x="610" y="98" font-size="12.5" font-weight="600" fill="#e2e8f0">休止してから、次の項目へ</text><rect x="300" y="138" width="230" height="54" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="2.2"/><text x="415.0" y="162.0" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">timeout</text><text x="415.0" y="179.0" text-anchor="middle" font-size="11" fill="#94a3b8">上限時間を過ぎた</text><line x1="206" y1="200" x2="300" y2="165" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ah)"/><line x1="530" y1="165" x2="600" y2="165" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ah)"/><text x="610" y="170" font-size="12.5" font-weight="600" fill="#e2e8f0">通知を出して、次へ進む</text><rect x="300" y="210" width="230" height="54" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2.2"/><text x="415.0" y="234.0" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">interrupted</text><text x="415.0" y="251.0" text-anchor="middle" font-size="11" fill="#94a3b8">停止・新しい再生</text><line x1="206" y1="200" x2="300" y2="237" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ah)"/><line x1="530" y1="237" x2="600" y2="237" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ah)"/><text x="610" y="242" font-size="12.5" font-weight="600" fill="#e2e8f0">何も表示せず、終了する</text><rect x="300" y="282" width="230" height="54" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2.2"/><text x="415.0" y="306.0" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">error</text><text x="415.0" y="323.0" text-anchor="middle" font-size="11" fill="#94a3b8">interrupted 以外の onerror</text><line x1="206" y1="200" x2="300" y2="309" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ah)"/><line x1="530" y1="309" x2="600" y2="309" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ah)"/><text x="610" y="314" font-size="12.5" font-weight="600" fill="#e2e8f0">エラーを表示し、状態を解除</text><rect x="36" y="364" width="760" height="34" rx="8" fill="rgba(15,23,42,0.88)" stroke="#94a3b8" stroke-width="1.2"/><text x="416" y="386" text-anchor="middle" font-size="12" fill="#e2e8f0">どの結果でも、await の後にセッションIDを確かめ、古い再生なら何もせずに終わる</text></svg>