site_name: サイト運営者について
site_description: ENEOS（エネオス）の内部通報制度をめぐる訴訟の原告です。裁判・株主総会2026に関するウェブサイト以外に、実務経験（企業価値分析・Pythonデータ分析・E資格ホルダー）を活かして、「ちょっと面倒」を軽くするツールを作成しています。
site_url: https://minnanosaiban.github.io/tomo/
site_dir: site

# Zensical でビルドする（hotline・kessan-kabuka と同じ。MkDocs + Material でもビルドできる）
# site_author: Mokeya
# copyright: Copyright &copy; 2025 ★★★

nav:
  - Home:
      - index.md
  - 技術解説:
      - アプリ:
          - 応援傍聴ナビ: tech/court-calendar.md
          - 有報ナビ: tech/stock-analysis.md
          - 英語学習アプリ: tech/eng-study.md
      - ツール:
          - PDFツール: tech/pdf-tools.md
          - サイドノート作成: tech/sidenote.md
          - 関係図エディタ RelaGrid: tech/relagrid.md
          - スキャン墨消し: tech/scan-ocr.md
          - スクショPDF化: tech/screenshot-pdf.md
          - Xスクショ管理ツール: tech/screenshot-x.md
          - 株価データ取得ツール: tech/data-hub.md
      - ウェブサイト:
          - E資格 動く数式ノート: tech/e-shikaku.md
          - 内部通報制度をめぐる裁判記録: tech/hotline.md
          - ウェブサイトデザイン: tech/web-design.md

# 決算・株価データ検証は https://minnanosaiban.github.io/kessan-kabuka/ に移転した（2026-10-11）。
# docs/blog/ には旧URLからの転送ページ（front matter の redirect_to）だけを残している。nav には載せない。

extra_css:
  - css/shared/tokens.css   # 共通（minna-design から sync.bat で同期。直接編集しない）
  - css/shared/base.css
  - css/shared/layout.css
  - css/shared/components.css
  - css/shared/parts.css
  - css/nav-groups.css      # tomo 固有：技術解説ナビの区切り（ーアプリー等）
  - css/tech-links.css      # tomo 固有：技術解説ページ最上部のリンク（下線なし・横並び）
  - https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap
  - https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css

extra_javascript:
  - js/custom.js
  - js/lightbox.js # 図のクリック拡大（旧 glightbox の代わり。Zensical はプラグインを使えない）

theme:
  name: "material"
  variant: classic # Zensical で Material 風の見た目にする指定（MkDocs では無視される）
  language: ja # サイトの言語（<html lang="ja">・UIラベル・読み上げ）
  custom_dir: overrides # カスタマイズ用のディレクトリ
  logo: img/card1.png # サイト左上のアイコン
  favicon: img/favicon.png

  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: bootstrap/brightness-high
        name: ダークモードに切り替えます
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: bootstrap/moon-stars-fill
        name: ライトモードに切り替えます

  features:
    - content.code.annotate # コードブロック内の注釈
    - content.code.copy # コードブロックの「コピー」ボタン
    - content.code.select # コードブロックの範囲選択機能
    - content.footnote.tooltips # 脚注をツールチップとして表示
    - content.tabs.link # タブ間のリンクを有効化
    - content.tooltips # ツールチップ（補足説明のポップアップ）を有効化
    - navigation.tabs # タブ形式のナビゲーション
    - navigation.tabs.sticky # タブ形式のナビゲーションをスクロールしても上部に固定
    - navigation.expand # ナビゲーションメニューを最初からすべて展開
    - navigation.top # トップへ戻るボタン
    - navigation.indexes # index.md を含むディレクトリをナビゲーションの親として扱う
    - navigation.expand # ナビゲーションメニューを最初からすべて展開
    - navigation.sections # 折りたたまずに全てフラットに表示
    
    # - announce.dismiss # アナウンスバーを表示
    # - content.action.edit # 「編集」ボタンを表示
    # - content.action.view # 「ソースを表示」ボタン
    # - content.code.annotate # コードブロック内の注釈
    # - content.code.copy # コードブロックの「コピー」ボタン
    # - content.code.select # コードブロックの範囲選択機能
    # - content.footnote.tooltips # 脚注をツールチップとして表示
    # - content.tabs.links # タブ間のリンクを有効化
    # - content.tooltips # ツールチップ（補足説明のポップアップ）を有効化
    # - header.autohide # ヘッダーが隠れる
    # - navigation.expand # ナビゲーションメニューを最初からすべて展開
    # - navigation.sections # 折りたたまずに全てフラットに表示
    # - navigation.footer # ページ下部に「前へ・次へ」のナビゲーション
    # - navigation.indexes # index.md を含むディレクトリをナビゲーションの親として扱う
    # - navigation.instant # ページ遷移を高速化するインスタントナビゲーション
    # - navigation.instant.prefetch # インスタントナビゲーションのプリフェッチ（事前読み込み）
    # - navigation.instant.progress # インスタントナビゲーションの読み込み進行状況を表示
    # - navigation.prune # ナビゲーションのメニュー項目を縮小し、必要なものだけ表示
    # - navigation.tabs # タブ形式のナビゲーション
    # - navigation.tabs.sticky # タブ形式のナビゲーションをスクロールしても上部に固定
    # - navigation.top # トップへ戻るボタン
    # - navigation.tracking  # ページのスクロールに応じて、見出しを更新
    # - toc.follow # TOCがスクロールに応じて現在の見出しを追従
    # - toc.integrate # TOCをナビゲーションの一部として統合
    # - search.highlight # 検索結果のハイライト表示
    # - search.share # 検索結果の URL をコピーするボタン
    # - search.suggest # 検索時に、関連する検索候補を表示

plugins: [] # プラグインは使わない（MkDocs は書かないと search が自動で有効になるため空を明示。Zensical は無視する）

validation: # ナビゲーションやリンクが切れることが気になるときに設定
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - meta # フロントマターを使えるようにする
  - md_in_html # マークダウンとhtmlを一緒に使う
  - attr_list # マークダウンでもhtml属性を設定することができる
  - nl2br # スペース2つ付けなくても改行
  - sane_lists # リストの誤動作を防ぐ
  - footnotes # 文末脚注（content.footnote.tooltipsと合わせてツールチップ表示になる）
  - toc: # tocを自動的に生成
      toc_depth: 4 # tocの深さ（表示制御はoverrides/main.htmlで行う）
  - pymdownx.emoji: # 絵文字を使う
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.smartsymbols # ダブルクォーテーション等の表示をキレイにする
  - pymdownx.caret # キャレット記号（^）によるsupタグ（上付き文字）
  - pymdownx.details # detailsタグによる折り畳み処理
  - pymdownx.mark # markタグ（ハイライト）
  - pymdownx.betterem: # emタグやstrongタグ（強調）を区別する
  - pymdownx.snippets
  - pymdownx.superfences: # コードブロック + Mermaid 図
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

